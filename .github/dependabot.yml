version: 2
updates:
  # Go modules. Group the Kubernetes client libraries so their lockstep updates
  # land in one PR; everything else in the module goes into a second weekly PR.
  # Each ecosystem then costs one CI round per week instead of one per bump
  # (the main ruleset requires an up-to-date branch, so every extra PR repeats
  # the full required checks).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      gomod:
        patterns:
          - "*"
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"

  # Pinned dev tools (helm-docs) in hack/tools.
  - package-ecosystem: gomod
    directory: "/hack/tools"
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ["*"]

  # GitHub Actions used in the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Keep every github/codeql-action/* step (init, analyze, upload-sarif) on
      # the same version in one PR. When init and analyze drift apart, CodeQL
      # fails with "Loaded a configuration file for version X, but running
      # version Y".
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # All other actions in one PR.
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"

  # Base images in the Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"

  # Documentation site dependencies (mkdocs-material, hash-pinned in
  # docs/requirements.txt). Without this block Dependabot never bumps them, so
  # an advisory against e.g. certifi stays open with no PR.
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: weekly
    groups:
      docs:
        patterns:
          - "*"
