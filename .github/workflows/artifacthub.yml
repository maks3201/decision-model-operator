name: Artifact Hub metadata

# Publishes charts/artifacthub-repo.yml next to the OCI chart as the special
# `artifacthub.io` tag (verified publisher / ownership claim).
on:
  push:
    branches: [main]
    paths: ["charts/artifacthub-repo.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    name: push artifacthub-repo.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - name: Push metadata to GHCR
        env:
          ORAS_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$ORAS_PASSWORD" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd charts
          oras push ghcr.io/maks3201/charts/decision-model-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
