name: Lint

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run linter
        run: make lint

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint charts/decision-model-operator

      - name: helm template (default + custom values)
        run: |
          helm template dmo charts/decision-model-operator --namespace dmo-system >/dev/null
          helm template dmo charts/decision-model-operator --namespace dmo-system \
            --set replicaCount=3 \
            --set image.tag=v9.9.9 \
            --set manager.allowInsecureRegistries=true \
            --set manager.allowImageOverride=true \
            --set manager.ollayaRegistry=https://reg.internal \
            --set manager.ollayaHFEndpoint=https://hf.internal \
            --set manager.runtimeVersionPolicy=FollowOperator \
            --set manager.maxConcurrentRollouts=2 \
            --set metrics.enabled=false >/dev/null

      - name: values.schema.json rejects typos and bad values
        run: |
          # Each of these MUST fail schema validation; the step fails if any passes.
          assert_fail() {
            if helm template dmo charts/decision-model-operator "$@" >/dev/null 2>&1; then
              echo "schema did NOT reject: helm template $*" >&2
              exit 1
            fi
          }
          assert_fail --set manager.ollayaRegistyr=https://x   # typo'd key under manager
          assert_fail --set proxy.htpProxy=http://x            # typo'd key under proxy
          assert_fail --set image.pullPolicy=Sometimes         # not in the enum
          assert_fail --set manager.ollayaRegistry=ftp://x     # not an http(s) URL
          assert_fail --set replicaCount=notanumber            # wrong type
          assert_fail --set manager.runtimeVersionPolicy=Bogus # not in the enum
          assert_fail --set manager.maxConcurrentRollouts=-1   # below minimum
          assert_fail --set manager.maxConcurrentRollouts=notint # wrong type
          echo "schema correctly rejected all negative cases"

      - name: artifacthub.io/changes generator produces a packageable chart
        run: |
          # Smoke-test the release-time changelog generator against the current
          # chart version: output must be non-empty, inject cleanly into a full
          # chart copy, and still `helm package`.
          ver="$(awk '/^version:/ { print $2; exit }' charts/decision-model-operator/Chart.yaml)"
          out="$(hack/chart-changes.sh "$ver")"
          test -n "$out" || { echo "no changes generated for $ver" >&2; exit 1; }
          tmp="$(mktemp -d)"
          cp -r charts/decision-model-operator "$tmp/chart"
          hack/chart-annotate-changes.sh "$ver" "$tmp/chart/Chart.yaml"
          helm package "$tmp/chart" --destination "$tmp/dist" >/dev/null
          rm -rf "$tmp"
          echo "changes generator OK for $ver"

      - name: Chart README is up to date (helm-docs, no drift)
        run: |
          # helm-docs is pinned in hack/tools/go.mod (go.sum is the lock file).
          go -C hack/tools tool helm-docs --chart-search-root=../../charts/decision-model-operator --sort-values-order=file
          git diff --exit-code -- charts/decision-model-operator/README.md

      - name: CRD is in sync with config/crd/bases (no drift)
        run: |
          diff -u config/crd/bases/decisionmodel.io_decisionmodels.yaml \
                  charts/decision-model-operator/crds/decisionmodel.io_decisionmodels.yaml

      - name: Manager RBAC is in sync with config/rbac/role.yaml (no drift)
        run: |
          diff -u config/rbac/role.yaml \
                  charts/decision-model-operator/files/role.yaml

