name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Scanner needs read access to compute PR decoration; nothing is written.
permissions:
  contents: read

jobs:
  sonar:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets are not exposed to workflows triggered by forks, so the scan would
    # fail there with a 401. Skip it on fork PRs; it still runs on branches and
    # on PRs from this repo.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets SonarQube assign issues to the right author/commit.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: make test

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
