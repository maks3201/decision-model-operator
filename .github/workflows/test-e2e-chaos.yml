name: E2E Chaos

# Injects registry, runtime and cluster faults between critical reconcile steps and
# asserts the documented recovery (transient registry outage keeps the stable serving,
# 404 is ModelNotFound, a runtime blip during eval holds and retries, a lost store
# recovers, a brief stable-Pod loss during stabilization does not roll back). Slow (it
# drives several candidate model loads through the in-cluster mirror), so it runs
# nightly on its own, isolated from the model-matrix and HA nightlies. kustomize, CPU,
# laya:en (the mirror serves laya:en).
on:
  schedule:
    - cron: "11 4 * * *" # daily, 04:11 UTC (off-peak; after nightly 03:17, chart 03:41, ha 03:53)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-e2e-chaos:
    name: kind (kustomize, CPU, laya:en) chaos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # The chaos suite builds the mirror image (~0.85 GiB) and loads a second copy of
      # the model to the kind node; reclaim the large preinstalled toolchains so there
      # is room. df before/after is logged.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run the chaos suite
        env:
          E2E_INSTALL: kustomize
          # The chaos specs break the in-cluster mirror, so build + load it.
          E2E_MIRROR: "1"
          E2E_LABEL_FILTER: chaos
        run: make test-e2e

  notify-failure:
    name: open an issue on a failed scheduled run
    needs: [test-e2e-chaos]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or comment on a nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          failed="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate -q '.jobs[] | select(.conclusion=="failure") | "- \(.name)"')"
          [ -n "${failed}" ] || failed="- (no job marked failed; see the run)"
          title="Nightly failed: ${WORKFLOW}"
          body="$(printf 'Scheduled run failed.\n\nRun: %s\n\nFailed jobs:\n%s\n' "${RUN_URL}" "${failed}")"
          existing="$(gh issue list --label nightly-failure --state open \
            --search "${title} in:title" --json number,title \
            -q ".[] | select(.title == \"${title}\") | .number" | head -n1)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh label create nightly-failure --color b60205 \
              --description "A scheduled E2E workflow failed" --force >/dev/null 2>&1 || true
            gh issue create --title "${title}" --label nightly-failure --body "${body}"
          fi
