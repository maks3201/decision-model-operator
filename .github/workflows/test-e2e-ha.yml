name: E2E HA Failover

# Proves leader-election HA end to end: the controller-manager runs with two
# replicas and, in each reachable rollout phase, the Lease holder Pod is killed and
# the surviving replica must take over and finish the rollout with the same outcome
# and no duplicated side effects. Slow (it drives several candidate model loads), so
# it runs nightly on its own, isolated from the model-matrix nightly's time budget.
# kustomize install, CPU, laya:en (deterministic).
on:
  schedule:
    - cron: "53 3 * * *" # daily, 03:53 UTC (off-peak, after the model-matrix and chart-upgrade nightlies)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e-ha:
    name: kind (kustomize, CPU, laya:en) HA failover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # Reclaim the large preinstalled toolchains so the kind node has room for the
      # runtime image plus the model store across the candidate revisions this suite
      # rolls out. df before/after is logged.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run the HA failover suite
        env:
          E2E_INSTALL: kustomize
          # Run only the HA failover container (labelled ha); the suite scales the
          # manager to two replicas itself and restores one on teardown.
          E2E_LABEL_FILTER: ha
        run: make test-e2e
