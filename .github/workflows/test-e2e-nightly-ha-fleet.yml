name: E2E Nightly HA Switch Points + Fleet Stress

# Two heavy scheduled scenarios kept off the per-PR budget and isolated from the
# model-matrix nightly:
#   - ha-switch: leader-election failover at the rollout switch points the primary
#     HA suite (test-e2e-ha.yml) leaves out — Caching/Starting, right after
#     promotion, and during stable store recovery. Two manager replicas, kustomize,
#     CPU, laya:en.
#   - fleet: 500 DecisionModels against --max-concurrent-rollouts=5, with an
#     unschedulable memory request so no model is ever loaded; measures reconcile
#     latency, manager RSS and API request rate under fleet-scale load and asserts
#     the budget invariant.
# Each job runs on its own kind cluster so they never collide.
on:
  schedule:
    - cron: "41 4 * * *" # daily, 04:41 UTC (off-peak, after the ha / model-matrix nightlies)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ha-switch:
    name: kind (kustomize, CPU, laya:en) HA switch points
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run the HA switch-points suite
        env:
          E2E_INSTALL: kustomize
          # Only the switch-points container; it scales the manager to two replicas
          # itself and restores one on teardown (its own namespace, distinct from the
          # primary HA suite).
          E2E_LABEL_FILTER: ha-switch
          KIND_CLUSTER: dmo-e2e-ha-switch
        run: make test-e2e

  fleet:
    name: kind (kustomize, CPU) 500-DM fleet stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run the fleet stress suite
        env:
          E2E_INSTALL: kustomize
          # Only the fleet-stress container. No model is loaded (every DM requests an
          # unschedulable amount of memory), so it needs no extra disk/RAM headroom.
          E2E_LABEL_FILTER: fleet
          KIND_CLUSTER: dmo-e2e-fleet
        run: make test-e2e
