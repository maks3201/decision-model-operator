name: E2E Nightly

# Per-PR E2E only exercises laya:en. This scheduled run exercises other model
# families so a runtime or registry change that breaks them is caught without
# slowing PRs. kustomize install, CPU. A failure turns the run red; no issues
# are opened.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (off-peak)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: kind (kustomize, CPU, ${{ matrix.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Sizes from docs/sizing.md (CPU/F32, cgroup anon): gliclass:latest
        # ~2.42 GiB, nli:latest ~3.62 GiB — both fit ubuntu-latest (~16 GB RAM).
        model: [gliclass:latest, nli:latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # Match test-e2e.yml: reclaim the large preinstalled toolchains to avoid
      # "No space left on device" when the kind node holds the runtime image and
      # the model store. df before/after is logged.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run e2e
        env:
          E2E_INSTALL: kustomize
          E2E_MODEL: ${{ matrix.model }}
          # The mirror spec is laya-specific (dmo-e2e-mirror:laya-en); leave
          # E2E_MIRROR unset so it skips for the non-laya nightly models.
        run: make test-e2e
