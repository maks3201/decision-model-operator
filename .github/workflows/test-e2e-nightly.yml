name: E2E Nightly

# Per-PR E2E only exercises laya:en. This scheduled run exercises other model
# families so a runtime or registry change that breaks them is caught without
# slowing PRs. kustomize install, CPU. A failure turns the run red; no issues
# are opened.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (off-peak)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: kind (kustomize, CPU, ${{ matrix.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Sizes from docs/sizing.md (CPU/F32, cgroup anon): gliclass:latest
        # ~2.42 GiB, nli:latest ~3.62 GiB — both fit ubuntu-latest (~16 GB RAM).
        model: [gliclass:latest, nli:latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # Match test-e2e.yml: reclaim the large preinstalled toolchains to avoid
      # "No space left on device" when the kind node holds the runtime image and
      # the model store. df before/after is logged.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run e2e
        env:
          E2E_INSTALL: kustomize
          E2E_MODEL: ${{ matrix.model }}
          # The mirror spec is laya-specific (dmo-e2e-mirror:laya-en); leave
          # E2E_MIRROR unset so it skips for the non-laya nightly models.
          # The HA and chaos containers have their own nightly workflows
          # (test-e2e-ha.yml / test-e2e-chaos.yml, laya:en) and are excluded here so
          # they do not add to this job's budget. recreate, scheduler-edge and
          # registry-outage need their own clusters (shards below / in test-e2e.yml);
          # scheduler, fleet and ha-switch run once on laya:en in their own jobs --
          # all excluded from the per-model matrix, which runs on a single node
          # against non-laya models. fault-matrix is laya-specific (gap 1 pulls
          # laya:multilingual) and runs in its own job below.
          E2E_LABEL_FILTER: "!ha && !ha-switch && !chaos && !recreate && !scheduler && !fleet && !scheduler-edge && !registry-outage && !fault-matrix"
        run: make test-e2e

  # Fault-matrix container (fault_matrix_test.go): a spec.model change during an
  # in-flight stable store recovery, manager-Pod restarts across the promotion seam,
  # and concurrent reconciles against a multi-replica stable. laya:en +
  # laya:multilingual over the default registry (no mirror); single-node is enough.
  # Selected by the "fault-matrix" label; nightly only. free_disk is on (two model
  # stores on the kind node).
  fault-matrix:
    name: kind (kustomize fault-matrix, CPU, laya:en)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run e2e
        env:
          E2E_INSTALL: kustomize
          E2E_LABEL_FILTER: "fault-matrix"
          KIND_CLUSTER: dmo-e2e-fault-matrix
        run: make test-e2e

  # Scheduler/storage edge cases (capacity-1 resource with a terminating Pod,
  # anti-affinity vs co-location, a paused node, the manifest ConfigMap deleted
  # mid-prefetch). Needs the multi-node cluster from hack/kind-recreate.yaml.
  scheduler-edge:
    name: kind (kustomize scheduler-edge, multi-node, CPU, laya:en)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run e2e
        env:
          E2E_INSTALL: kustomize
          E2E_LABEL_FILTER: "scheduler-edge"
          KIND_CLUSTER: dmo-e2e-scheduler-edge
          KIND_CONFIG: hack/kind-recreate.yaml
        run: make test-e2e

  # Registry-outage container (registry_outage_test.go): a DNS failure, a TCP reset,
  # an outage after Resolve but during prefetch, and an outage during stable store
  # recovery, all through the in-cluster mirror (so the registry can be broken). It
  # is laya-specific (the mirror image bakes in laya:en) and needs E2E_MIRROR to
  # build the mirror image; single-node is enough. free_disk is on (mirror image +
  # model). Selected by the "registry-outage" label; nightly only.
  registry-outage:
    name: kind (kustomize registry-outage, CPU, laya:en)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run e2e
        env:
          E2E_INSTALL: kustomize
          # Select only the registry-outage container (laya:en, the default model).
          E2E_LABEL_FILTER: "registry-outage"
          # Build+load the mirror image so the registry can be broken offline.
          E2E_MIRROR: "1"
          KIND_CLUSTER: dmo-e2e-registry-outage
        run: make test-e2e


  # Run the default per-PR E2E suite (laya:en, kustomize) on each Kubernetes minor
  # the project claims to support. The per-PR workflow only exercises the newest
  # minor (test-e2e.yml) and the release upgrade E2E only the oldest+newest, so the
  # middle minor (K8S_MIDDLE) is otherwise never exercised. Versions come from
  # hack/k8s-versions.env (the single source of truth) at run time; nothing here
  # hard-codes a version. One leg per minor, each on its own cluster, in parallel.
  k8s-versions:
    name: kind (kustomize, CPU, laya:en, ${{ matrix.slot }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Which KIND_NODE_IMAGE_* key from hack/k8s-versions.env to pin. The actual
        # ref and version are read from the file in the job (never hard-coded here).
        slot: [OLDEST, MIDDLE, NEWEST]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # Resolve this leg's kind node image from hack/k8s-versions.env. The file is
      # the single source of truth; we source it, pick the KIND_NODE_IMAGE_<slot>
      # ref, and surface the three supported versions in the job summary so a reader
      # sees exactly which minors ran without opening the file.
      - name: Resolve Kubernetes version from hack/k8s-versions.env
        id: k8s
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . ./hack/k8s-versions.env
          node_var="KIND_NODE_IMAGE_${SLOT}"
          ver_var="K8S_${SLOT}"
          node="${!node_var}"
          ver="${!ver_var}"
          if [ -z "$node" ] || [ -z "$ver" ]; then
            echo "::error::no entry for slot ${SLOT} in hack/k8s-versions.env"; exit 1
          fi
          echo "node_image=$node" >>"$GITHUB_OUTPUT"
          echo "version=$ver" >>"$GITHUB_OUTPUT"
          # Lowercase cluster name (kind requires lowercase, DNS-safe names).
          slot_lc="$(printf '%s' "$SLOT" | tr '[:upper:]' '[:lower:]')"
          echo "cluster=dmo-e2e-k8s-${slot_lc}" >>"$GITHUB_OUTPUT"
          {
            echo "### Kubernetes version matrix (hack/k8s-versions.env)"
            echo ""
            echo "- oldest: \`${K8S_OLDEST}\`"
            echo "- middle: \`${K8S_MIDDLE}\`"
            echo "- newest: \`${K8S_NEWEST}\`"
            echo ""
            echo "This leg (**${SLOT}**): \`${ver}\` → \`${node}\`"
          } >>"$GITHUB_STEP_SUMMARY"

      # The !nightly kustomize suite includes the registry-mirror spec, which builds
      # an extra ~0.85 GiB image and loads a second copy of the model, so reclaim the
      # large preinstalled toolchains to avoid "No space left on device" (same step
      # as the mirror shard in test-e2e.yml). df before/after is logged.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run e2e
        env:
          E2E_INSTALL: kustomize
          # Pin the kind node image to this leg's Kubernetes minor; hack/kind-up.sh
          # honours KIND_NODE_IMAGE and the suite inherits the environment.
          KIND_NODE_IMAGE: ${{ steps.k8s.outputs.node_image }}
          # Run the full default kustomize suite (same label set as the per-PR
          # kustomize shards combined): lifecycle, mirror, eval and auth on laya:en.
          E2E_LABEL_FILTER: "!nightly"
          # The mirror spec is in !nightly, so build+load its image on this job.
          E2E_MIRROR: "1"
          # Own cluster per leg so parallel legs do not collide (lowercase name
          # from the resolve step; kind requires lowercase).
          KIND_CLUSTER: ${{ steps.k8s.outputs.cluster }}
        run: make test-e2e

  # Model-agnostic stress containers that are not worth a per-PR slot: the
  # single-scarce-resource rollout (scheduler) and the large-fleet reconcile cost
  # (fleet). Both run on a single node on laya:en. They are labelled "nightly" so
  # the per-PR and k8s-version (!nightly) runs never pick them up, and excluded
  # from the per-model matrix above (model-agnostic). One cluster, run serially.
  stress:
    name: kind (kustomize, CPU, laya:en, scheduler + fleet)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Run e2e
        env:
          E2E_INSTALL: kustomize
          # scheduler advertises a fake extended resource and rolls out; fleet creates
          # a few hundred DecisionModels pinned to unresolvable tags (no model loads).
          E2E_LABEL_FILTER: "scheduler"
          KIND_CLUSTER: dmo-e2e-stress
        run: make test-e2e

  notify-failure:
    name: open an issue on a failed scheduled run
    needs: [test-e2e, fault-matrix, scheduler-edge, registry-outage, k8s-versions, stress]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or comment on a nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          failed="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate -q '.jobs[] | select(.conclusion=="failure") | "- \(.name)"' || true)"
          [ -n "${failed}" ] || failed="- (no job marked failed; see the run)"
          title="Nightly failed: ${WORKFLOW}"
          body="$(printf 'Scheduled run failed.\n\nRun: %s\n\nFailed jobs:\n%s\n' "${RUN_URL}" "${failed}")"
          existing="$(gh issue list --label nightly-failure --state open \
            --search "${title} in:title" --json number,title \
            -q ".[] | select(.title == \"${title}\") | .number" | head -n1)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh label create nightly-failure --color b60205 \
              --description "A scheduled E2E workflow failed" --force >/dev/null 2>&1 || true
            gh issue create --title "${title}" --label nightly-failure --body "${body}"
          fi
