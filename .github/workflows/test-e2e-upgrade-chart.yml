name: E2E Chart Upgrade

# Proves a Helm-chart operator upgrade does not roll any DecisionModel (runtime
# version pinned by default). Runs on PRs that touch the API, the chart, the
# controller or the engine (the surfaces that could regress the no-roll promise),
# on push to main for those paths, and nightly.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "charts/**"
      - "internal/controller/**"
      - "internal/engine/**"
      - "hack/upgrade-chart-e2e.sh"
      - ".github/workflows/test-e2e-upgrade-chart.yml"
  pull_request:
  schedule:
    - cron: "41 3 * * *" # nightly, 03:41 UTC (off-peak, after the model-matrix nightly)
  workflow_dispatch:
    inputs:
      from:
        description: "Upgrade-from chart/release version (default: latest release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether the heavy upgrade job needs to run. It is relevant only when a
  # surface that could regress the no-roll promise changed; anything else (incl.
  # docs-only) skips it, while the gate job below still reports success so a
  # required check never hangs. The nightly schedule and workflow_dispatch always run.
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          base="$BASE_SHA"
          [ "$EVENT" = "push" ] && base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "changed files:"; echo "$files"
          # Relevant surfaces for the no-roll promise.
          if echo "$files" | grep -qE '^(api/|charts/|internal/controller/|internal/engine/|hack/upgrade-chart-e2e\.sh$|\.github/workflows/test-e2e-upgrade-chart\.yml$)'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  upgrade:
    name: chart upgrade (kustomize CRD, CPU, laya:en)
    needs: changes
    # Run when a relevant surface changed, except on the Release Please bot PR
    # (its pull_request runs sit in action_required and add nothing); the
    # push-to-main run still covers the merge.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.head_ref != 'release-please--branches--main--components--decision-model-operator')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Check helm
        run: helm version

      # The upgrade brings up two serving model Pods plus a second (candidate) store
      # during the opt-in roll; reclaim the large preinstalled toolchains to avoid
      # "No space left on device" on the kind node. df before/after is logged.
      - name: Free disk space
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Chart upgrade e2e
        env:
          # The released chart and operator image are public, so no token is needed.
          KIND_CLUSTER: dmo-chart-upgrade
          FROM_VERSION: ${{ inputs.from }}
        run: ./hack/upgrade-chart-e2e.sh ${FROM_VERSION:+"$FROM_VERSION"}

  # Always-reporting gate. This is the stable name for branch protection: it
  # passes when the upgrade job succeeded or was skipped (irrelevant change,
  # docs-only, or the Release Please bot PR), and fails only when it failed or
  # was cancelled.
  chart-upgrade-e2e-required:
    name: chart-upgrade-e2e-required
    needs: [changes, upgrade]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.upgrade.result }}
        run: |
          set -euo pipefail
          echo "chart upgrade result: $RESULT"
          case "$RESULT" in
            success|skipped) echo "gate OK"; exit 0 ;;
            *) echo "required job did not succeed"; exit 1 ;;
          esac
