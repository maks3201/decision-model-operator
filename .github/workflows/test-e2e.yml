name: E2E Tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the in-flight E2E run (main included): only the latest
  # commit needs E2E, and serial runs queued for 10-25 min. Exception: the
  # release gate (release-please.yml) waits for the E2E run of the exact release
  # commit, so a release commit gets its own group (keyed by SHA) and is never
  # cancelled by a later push.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    startsWith(github.event.head_commit.message, 'chore(main): release') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: kind (${{ matrix.install }}, CPU, laya:en)
    runs-on: ubuntu-latest
    # Skip E2E on the Release Please PR branch: that bot PR only touches
    # CHANGELOG/Chart.yaml/manifest, its pull_request runs sit in
    # action_required (manual approval) and add nothing. E2E still runs on push
    # to main (the merge) and on workflow_dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'release-please--branches--main--components--decision-model-operator'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        install: [kustomize, helm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Check helm
        if: matrix.install == 'helm'
        run: helm version

      # The mirror spec (kustomize job) adds a ~0.85 GiB mirror image plus a second
      # copy of the model to the kind node; the stock ubuntu-latest free space is
      # not enough and E2E failed with "No space left on device". Reclaim
      # the large preinstalled toolchains we do not use. df before/after is logged.
      - name: Free disk space
        if: matrix.install == 'kustomize'
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run e2e
        env:
          E2E_INSTALL: ${{ matrix.install }}
          # Run the registry-mirror spec (kustomize job only; the Go setup guards
          # on install method). Builds + loads the mirror image in BeforeSuite.
          E2E_MIRROR: "1"
        run: make test-e2e
