name: E2E Tests

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push cancels the in-flight E2E run (main included): only the latest
  # commit needs E2E, and serial runs queued for 10-25 min. Exception: the
  # release gate (release-please.yml) waits for the E2E run of the exact release
  # commit, so a release commit gets its own group (keyed by SHA) and is never
  # cancelled by a later push.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    startsWith(github.event.head_commit.message, 'chore(main): release') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  # Decide whether the heavy E2E matrix needs to run. A docs-only change (only
  # docs/** or *.md) skips it; the gate job below still reports success so a
  # required check never hangs on a docs-only PR.
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          base="$BASE_SHA"
          [ "$EVENT" = "push" ] && base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "changed files:"; echo "$files"
          if echo "$files" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  test-e2e:
    name: kind (${{ matrix.install }}, CPU, laya:en)
    needs: changes
    # Run when code changed, except on the Release Please PR branch: that bot PR
    # only touches CHANGELOG/Chart.yaml/manifest, its pull_request runs sit in
    # action_required (manual approval) and add nothing. E2E still runs on push
    # to main (the merge) and on workflow_dispatch.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.head_ref != 'release-please--branches--main--components--decision-model-operator')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        install: [kustomize, helm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Check helm
        if: matrix.install == 'helm'
        run: helm version

      # The mirror spec (kustomize job) adds a ~0.85 GiB mirror image plus a second
      # copy of the model to the kind node; the stock ubuntu-latest free space is
      # not enough and E2E failed with "No space left on device". Reclaim
      # the large preinstalled toolchains we do not use. df before/after is logged.
      - name: Free disk space
        if: matrix.install == 'kustomize'
        run: |
          echo "disk before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune -af || true
          echo "disk after:"; df -h /

      - name: Run e2e
        env:
          E2E_INSTALL: ${{ matrix.install }}
          # Run the registry-mirror spec (kustomize job only; the Go setup guards
          # on install method). Builds + loads the mirror image in BeforeSuite.
          E2E_MIRROR: "1"
          # Skip specs labelled "nightly" on PRs to keep the run fast; the nightly
          # workflow runs them in full.
          E2E_LABEL_FILTER: "!nightly"
        run: make test-e2e

  # Always-reporting gate. This is the stable name for branch protection: it
  # passes when the matrix succeeded or was skipped (docs-only, or the Release
  # Please bot PR), and fails only when a matrix job failed or was cancelled.
  e2e-required:
    name: e2e-required
    needs: [changes, test-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.test-e2e.result }}
        run: |
          set -euo pipefail
          echo "E2E matrix result: $RESULT"
          case "$RESULT" in
            success|skipped) echo "gate OK"; exit 0 ;;
            *) echo "required job did not succeed"; exit 1 ;;
          esac
