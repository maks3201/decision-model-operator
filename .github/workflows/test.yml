name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether the heavy job needs to run. A docs-only change (only docs/**
  # or *.md) skips it; the gate job below still reports success so a required
  # check never hangs on a docs-only PR.
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch (and anything without a usable base) always runs.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          base="$BASE_SHA"
          [ "$EVENT" = "push" ] && base="$BEFORE_SHA"
          # No base (first push to a branch -> all-zero SHA): run to be safe.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "changed files:"; echo "$files"
          # Code if any changed file is NOT under docs/ and NOT a top-level-or-nested *.md.
          if echo "$files" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi

  test:
    name: unit + envtest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generated files are up to date
        run: |
          make manifests generate
          git diff --exit-code -- api config

      - name: API reference is up to date
        run: |
          make api-docs
          git diff --exit-code -- docs/api-reference.md

      # Fast, cluster-free guard over the generated ClusterRole (test/rbac): fails
      # on a wildcard verb/resource/group, secrets beyond get, configmaps
      # list/watch, or any rule not in the committed allow-list. It also runs as
      # part of `make test` below; this explicit step surfaces an RBAC-widening
      # regression immediately and independently of envtest.
      - name: RBAC guard
        run: go test ./test/rbac/...

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: cover.out
          fail_ci_if_error: false

      - name: Race detector
        run: |
          v=$(go list -m -f '{{ .Version }}' k8s.io/api | awk -F'[v.]' '{printf "1.%d", $3}')
          # shellcheck disable=SC2046 # word splitting is intended: pass each package as a separate arg
          KUBEBUILDER_ASSETS="$PWD/$(bin/setup-envtest use "$v" --bin-dir bin -p path)" \
            go test -race $(go list ./... | grep -v /e2e)

  # Always-reporting gate. This is the stable name for branch protection: it
  # passes when the heavy job succeeded or was skipped (docs-only), and fails
  # only when the heavy job failed or was cancelled.
  tests-required:
    name: tests-required
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "unit + envtest result: $RESULT"
          case "$RESULT" in
            success|skipped) echo "gate OK"; exit 0 ;;
            *) echo "required job did not succeed"; exit 1 ;;
          esac
