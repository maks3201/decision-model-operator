# SonarQube Cloud automatic analysis configuration.
# Reviewed false positives are marked inline with a `NOSONAR: <reason>` comment.

sonar.sources=.
sonar.exclusions=**/*_test.go,**/zz_generated.deepcopy.go,bin/**,test/**,docs/**,bundle/**,bundle.Dockerfile
sonar.tests=.
sonar.test.inclusions=**/*_test.go,test/**
