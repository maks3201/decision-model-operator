apiVersion: v2
name: decision-model-operator
description: >-
  Kubernetes Operator for Ollaya-served System-1 decision models (DecisionModel
  CRD).
type: application
version: 0.5.0
appVersion: 0.5.0
kubeVersion: '>=1.29.0-0'
home: https://maks3201.github.io/decision-model-operator/
icon: >-
  https://raw.githubusercontent.com/maks3201/decision-model-operator/main/docs/assets/logo.png
sources:
  - https://github.com/maks3201/decision-model-operator
keywords:
  - operator
  - ollaya
  - decision-model
  - laya
  - jev
  - system-1
  - kubernetes-operator
  - mlops
  - model-serving
  - inference
maintainers:
  - name: maks3201
    email: eumaxpl@gmail.com
    url: https://github.com/maks3201
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/prerelease: 'false'
  artifacthub.io/images: |
    - name: manager
      image: ghcr.io/maks3201/decision-model-operator:v0.5.0 # x-release-please-version
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Documentation
      url: https://maks3201.github.io/decision-model-operator/
    - name: Quickstart
      url: https://maks3201.github.io/decision-model-operator/quickstart/
    - name: API reference
      url: https://maks3201.github.io/decision-model-operator/api-reference/
    - name: support
      url: https://github.com/maks3201/decision-model-operator/issues
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: full lifecycle
  artifacthub.io/crds: |
    - kind: DecisionModel
      version: v1alpha1
      name: decisionmodels.decisionmodel.io
      displayName: Decision Model
      description: A pinned, prefetched, model-aware System-1 decision model served by Ollaya.
  artifacthub.io/crdsExamples: |
    - apiVersion: decisionmodel.io/v1alpha1
      kind: DecisionModel
      metadata:
        name: support-router
      spec:
        engine: ollaya
        model: laya:en
        device: cpu
        replicas: 1
        resources:
          requests:
            cpu: "1"
            memory: 3584Mi
