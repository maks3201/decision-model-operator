# Default values for decision-model-operator.

image:
  # -- Manager image repository.
  repository: ghcr.io/maks3201/decision-model-operator
  # -- Manager image tag. Empty defaults to `v<Chart.appVersion>` (release images are tagged `vX.Y.Z`).
  tag: ""
  # -- Image pull policy for the manager container.
  pullPolicy: IfNotPresent

# -- Secrets for pulling the manager image (e.g. `[{name: ghcr-pull}]` while the GHCR package is private).
imagePullSecrets: []
# -- Number of controller-manager replicas (leader election picks one active).
replicaCount: 1

# -- Resource requests/limits for the manager container.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# -- Node selector for the manager Pod.
nodeSelector: {}
# -- Tolerations for the manager Pod.
tolerations: []
# -- Affinity for the manager Pod.
affinity: {}

# -- Enable leader election (recommended for HA / `replicaCount` > 1).
leaderElection: true

# Metrics endpoint. When enabled, a metrics Service (8443/HTTPS) is created.
metrics:
  # -- Expose the metrics endpoint and create a metrics Service (8443/HTTPS).
  enabled: true
  # -- Address the metrics server binds to.
  bindAddress: ":8443"
  # -- Serve metrics over HTTPS.
  secure: true

# -- Health/readiness probe bind address.
healthProbeBindAddress: ":8081"

# Manager policy flags (see cmd/main.go, docs/quickstart.md "Operator flags").
# Security defaults are strict: only ollaya.dev, no http://, no image override.
manager:
  # -- `--allowed-registries`: comma-separated registry hosts a `spec.model` may resolve from (SSRF guard). Add your mirror here if you use one.
  allowedRegistries: "ollaya.dev"
  # -- `--allow-insecure-registries`: permit `http://` model registries (dev only).
  allowInsecureRegistries: false
  # -- `--allow-image-override`: permit `spec.image` to override the engine default image (lets DM editors run arbitrary images; keep false in multi-tenant).
  allowImageOverride: false
  # -- `--max-concurrent-reconciles`: max DecisionModels reconciled concurrently.
  maxConcurrentReconciles: 4
  # -- `--ollaya-registry`: default registry base URL for host-less model names. Empty = the operator default (`OLLAYA_REGISTRY` env, else `https://ollaya.dev`); not rendered when empty.
  ollayaRegistry: ""
  # -- `--ollaya-hf-endpoint`: base URL for model-weight downloads (a Hugging Face mirror or enterprise endpoint; the model registry still serves manifests). Empty = the runtime default (`OLLAYA_HF_ENDPOINT` env, else Hugging Face); not rendered when empty. Needs the 0.10.0+ runtime; older runtimes ignore it.
  ollayaHFEndpoint: ""
  # -- `--runtime-version-policy`: how an unset `spec.runtimeVersion` resolves. `Pinned` (default) reuses the stable revision's runtime version, so an operator upgrade starts no rollout; `FollowOperator` uses the engine default, so an upgrade rolls every DecisionModel onto the new runtime. Empty = the binary default (`Pinned`); not rendered when empty.
  runtimeVersionPolicy: ""
  # -- `--max-concurrent-rollouts`: cap on DecisionModels rolling out at once across the watched scope (`0` = unlimited; others wait in phase `Pending`). Set a small value (e.g. 2-3) to avoid a fleet-wide stampede when the default runtime image changes under `FollowOperator`. `null`/unset = the binary default (`0`, unlimited); not rendered unless set to a positive value.
  maxConcurrentRollouts: null

# -- Namespaces to watch (`--watch-namespaces`). Empty = cluster-wide (manager ClusterRole/ClusterRoleBinding). When non-empty, the operator watches only these namespaces and the chart renders a namespaced Role+RoleBinding in each instead of the ClusterRole. The CRD stays cluster-scoped and must be installed by a cluster admin.
watchNamespaces: []

# HTTP(S) proxy for the operator's egress to the model registry. Rendered as
# HTTP_PROXY / HTTPS_PROXY / NO_PROXY env on the manager container (nothing is
# rendered when a value is empty). The controller also copies these into the
# prefetch Job so it can pull weights through the proxy.
proxy:
  # -- `HTTP_PROXY` for the manager (and, via the operator, the prefetch Job). Empty = not set.
  httpProxy: ""
  # -- `HTTPS_PROXY` for the manager (and the prefetch Job). Empty = not set.
  httpsProxy: ""
  # -- `NO_PROXY` for the manager (and the prefetch Job). Set the service CIDR and `.svc,.cluster.local` so the operator's registry/API-server calls go direct, not via the proxy. The pod CIDR is NOT needed: the readiness prober and evaluator reach serving Pod IPs with a separate proxy-less client (the API-key header never traverses the proxy), so readiness does not depend on this value. Example: `10.96.0.0/12,.svc,.cluster.local`. Empty = not set.
  noProxy: ""
  # -- Name of an existing Secret to source the proxy URLs from (keys `httpProxy` / `httpsProxy` / `noProxy`, each optional) instead of the plaintext values above — use this when a proxy URL carries credentials. When set, the plaintext `proxy.httpProxy/httpsProxy/noProxy` values are ignored and the env is rendered with `valueFrom.secretKeyRef` (`optional: true` per key). This only keeps the credential out of the Helm values: a **credentialed** proxy URL is used by the operator for its own registry lookups but is NOT passed to the prefetch Jobs (a Job spec is readable by anyone with `get jobs` in that namespace), and the chart cannot change that. For the Job's egress use an IP-allowlisted or node-level proxy that needs no credentials. `NO_PROXY` is always passed. Empty = use the plaintext values.
  existingSecret: ""

# -- Install the CRD via Helm's `crds/` dir. Set false to manage the CRD out of band. NOTE: Helm never upgrades or deletes CRDs in `crds/` (see the CRD upgrade caveat in this README).
installCRDs: true

# Prometheus alerting rules (PrometheusRule CR, requires the Prometheus Operator).
# Disabled by default. Alerts fire only on metrics the operator exports today
# (see docs/metrics.md); each links a runbook under docs/runbooks/.
prometheusRule:
  # -- Create a `PrometheusRule` with the operator's alerting rules. Requires the Prometheus Operator CRDs.
  enabled: false
  # -- Namespace for the `PrometheusRule` (empty = release namespace).
  namespace: ""
  # -- Extra labels on the `PrometheusRule` (e.g. the `release:` label your Prometheus selects on).
  labels: {}
  # -- Base URL prepended to each alert's `runbook_url` annotation (points at the docs site or your fork).
  runbookUrl: "https://github.com/maks3201/decision-model-operator/blob/main/docs/runbooks"
  # -- Per-alert `for` windows (how long the symptom must hold before firing).
  windows:
    rolloutStuck: 15m
    degraded: 10m
    candidateTimeout: 20m
    operatorDown: 5m

# Grafana dashboard shipped as a sidecar-discovered ConfigMap (the Grafana
# `grafana_dashboard: "1"` label). Disabled by default.
grafanaDashboard:
  # -- Create a ConfigMap holding the operator Grafana dashboard, labelled for the Grafana sidecar to auto-import.
  enabled: false
  # -- Namespace for the dashboard ConfigMap (empty = release namespace; set to where the Grafana sidecar watches).
  namespace: ""
  # -- Extra labels on the dashboard ConfigMap (the sidecar label `grafana_dashboard: "1"` is always added).
  labels: {}
  # -- Value of the Grafana sidecar folder annotation (`k8s-sidecar-target-directory`); empty = the sidecar default.
  folder: ""
