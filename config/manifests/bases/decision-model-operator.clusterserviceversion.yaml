apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Full Lifecycle
    categories: AI/Machine Learning
    containerImage: ghcr.io/maks3201/decision-model-operator:v0.2.0 # x-release-please-version
    description: 'Run open-source System-1 decision models served by Ollaya on Kubernetes
      and manage their full model lifecycle: pin, prefetch, verify, evaluate, promote
      and roll back.'
    repository: https://github.com/maks3201/decision-model-operator
    support: https://github.com/maks3201/decision-model-operator/issues
  name: decision-model-operator.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: |-
        DecisionModel is the Schema for the decisionmodels API.

        metadata.name must be a DNS-1035 label of at most 43 characters (see
        MaxNameLength): the operator derives a Service named after it (no dots) and
        Job/PVC names that must stay within 63 characters.
      displayName: Decision Model
      kind: DecisionModel
      name: decisionmodels.decisionmodel.io
      version: v1alpha1
  description: |-
    The Decision Model Operator runs open-source System-1 decision models (Laya,
    Kev, JevK5, …) served by [Ollaya](https://github.com/ollaya-dev/ollaya) as
    first-class Kubernetes workloads and manages their **model lifecycle**:
    **pin → prefetch → load → verify → evaluate → promote → roll back**.

    ## Why

    A plain Deployment of a model server tells you the process is up. It does not
    tell you *which* model is loaded, *where* it runs, or whether a new version is
    any good. This operator closes those gaps:

    * **Digest pinning** — resolves `model: laya:en` to an immutable sha256 digest
      and records it in `status`. A moved tag never changes a running revision.
    * **Prefetch** — a Job pulls and verifies the weights into a per-revision
      volume *before* any serving Pod starts; serving Pods mount the store
      read-only.
    * **Model-aware readiness** — a Pod readiness gate
      (`decisionmodel.io/model-ready`) turns True only when the runtime reports the
      expected digest on the expected device, so a silent CUDA→CPU fallback keeps
      the Pod out of the Service.
    * **Blue-green rollout** — every model-affecting change creates a candidate
      revision next to the stable one; traffic switches only when the candidate is
      ready, and failures roll back automatically.
    * **Eval-gated promotion** — optionally runs a golden dataset against the
      candidate and promotes only if accuracy, accuracy drop and calibration (ECE)
      gates pass.
    * **Secure defaults** — registry allow-list, no `http://` registries, no image
      override, labelled API-key Secrets and restricted Pod security; each guard
      can be relaxed explicitly.

    ## How it works

    `DecisionModel` → Resolving (digest) → Caching (Job → volume) → Starting
    (candidate, readiness gate) → Evaluating (golden set, optional) → Promoting
    (Service switch) → Ready. Any failure rolls back to the stable revision or
    ends in Failed. The operator owns everything it creates through owner
    references, so deleting the `DecisionModel` cleans up.

    **Status: alpha.** The API is `decisionmodel.io/v1alpha1` and may change
    between minor versions. Not affiliated with TypeSafe, Convai Innovations or
    Ollaya.
  displayName: Decision Model Operator
