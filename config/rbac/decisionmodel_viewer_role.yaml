# This rule is not used by the project decision-model-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to decisionmodel.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: decision-model-operator
    app.kubernetes.io/managed-by: kustomize
  name: decisionmodel-viewer-role
rules:
- apiGroups:
  - decisionmodel.io
  resources:
  - decisionmodels
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - decisionmodel.io
  resources:
  - decisionmodels/status
  verbs:
  - get
