apiVersion: v1
kind: ConfigMap
metadata:
  name: support-router-golden
  labels:
    app.kubernetes.io/name: decision-model-operator
    app.kubernetes.io/managed-by: kustomize
data:
  # Golden dataset, one JSONL case per line. Each case:
  #   {"state": <any>, "questions": <object>, "expected": {"<qid>": "<choice>" | true | false}}
  cases.jsonl: |
    {"state":{"ticket":"card declined at checkout"},"questions":{"q1":{"type":"choice","options":["billing","technical","account"]}},"expected":{"q1":"billing"}}
    {"state":{"ticket":"app crashes on login"},"questions":{"q1":{"type":"choice","options":["billing","technical","account"]}},"expected":{"q1":"technical"}}
    {"state":{"ticket":"reset my password"},"questions":{"q1":{"type":"choice","options":["billing","technical","account"]}},"expected":{"q1":"account"}}
    {"state":{"ticket":"is this refund urgent?"},"questions":{"q1":{"type":"noul"}},"expected":{"q1":true}}
    {"state":{"ticket":"just saying thanks"},"questions":{"q1":{"type":"noul"}},"expected":{"q1":false}}
---
apiVersion: decisionmodel.io/v1alpha1
kind: DecisionModel
metadata:
  labels:
    app.kubernetes.io/name: decision-model-operator
    app.kubernetes.io/managed-by: kustomize
  name: support-router
spec:
  engine: ollaya
  model: laya:en
  device: cpu
  replicas: 1
  resources:
    requests:
      cpu: "1"
      memory: 3500Mi
    limits:
      memory: 4Gi
  rollout:
    # Promotion policy: Automatic | EvaluationGated | Manual. EvaluationGated (the
    # default when rollout.evaluation is set) promotes only after the gate passes.
    promotion: EvaluationGated
    evaluation:
      datasetRef:
        configMapRef:
          name: support-router-golden
          key: cases.jsonl
      minAccuracy: "0.90"
      maxAccuracyDrop: "0.02"
      maxECE: "0.10"
      maxECEIncrease: "0.02"
      maxCases: 500
