apiVersion: v1
kind: ConfigMap
metadata:
  name: intent-router-golden
  labels:
    app.kubernetes.io/part-of: decision-model-operator
    app.kubernetes.io/component: demo
data:
  # Golden dataset for the eval-gated rollout demo: 40 English support tickets,
  # one choice question "q" per case routing the ticket to a department. The
  # labels are human-authored ground truth (not learned from any one model), so
  # the gate measures each candidate against the same task.
  #
  # Each line: {"state": <ticket>, "questions": {...}, "expected": {"q": "<label>"}}
  # The questions object (choice question "q" with the same criteria) is identical
  # on every line, so every candidate is scored on exactly the same prompt.
  cases.jsonl: |
    {"state":"I was charged twice for my subscription this month, please refund the extra charge.","questions":{"q":{"type":"choice","criteria":{"billing":"billing, payments, charges, refunds, invoices","technical":"technical bugs, errors, crashes, outages","sales":"pricing, plans, upgrades, purchasing, licenses, quotes","account":"account settings, password, profile, login credentials, workspace members"}}},"expected":{"q":"billing"}}
    {"state":"My invoice shows a payment I did not authorize.","questions":{"q":{"type":"choice","criteria":{"billing":"billing, payments, charges, refunds, invoices","technical":"technical bugs, errors, crashes, outages","sales":"pricing, plans, upgrades, purchasing, licenses, quotes","account":"account settings, password, profile, login credentials, workspace members"}}},"expected":{"q":"billing"}}
