sonar.organization=maks3201
sonar.projectKey=maks3201_decision-model-operator

# Sources vs tests. SonarCloud derives Go coverage from the report below.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/zz_generated.deepcopy.go,**/*_test.go,bin/**,test/**,docs/**,config/**,charts/**,**/mock_*.go
sonar.coverage.exclusions=cmd/**,**/*_test.go,test/**,api/**
sonar.go.coverage.reportPaths=cover.out

# Reviewed rules that do not apply here.
sonar.issue.ignore.multicriteria=http,ctxtest,goinstall
# go:S5332 (clear-text HTTP): the Ollaya runtime serves plain HTTP inside the
# cluster (no TLS support), so Pod/Service URLs are http:// by design; the
# registry client only uses http:// behind --allow-insecure-registries, and a
# scheme-less proxy value defaults to http:// like net/http does.
sonar.issue.ignore.multicriteria.http.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.http.resourceKey=internal/**/*.go
# godre:S8188 (defer cancel): test contexts are cancelled in AfterSuite /
# DeferCleanup, which outlive the function that creates them.
sonar.issue.ignore.multicriteria.ctxtest.ruleKey=godre:S8188
sonar.issue.ignore.multicriteria.ctxtest.resourceKey=**/*_test.go
# githubactions:S8545 (lock-file install): tools are installed with
# `go install module@vX.Y.Z`, which is pinned and checksum-verified by sum.golang.org.
sonar.issue.ignore.multicriteria.goinstall.ruleKey=githubactions:S8545
sonar.issue.ignore.multicriteria.goinstall.resourceKey=.github/workflows/**
